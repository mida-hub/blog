<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mida</title>
  <meta name="description" content="mida's personal profile">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(240, 246, 252, 0.1);
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --link-bg: rgba(255, 255, 255, 0.05);
      --link-hover-bg: rgba(255, 255, 255, 0.12);
      --link-hover-border: rgba(255, 255, 255, 0.25);
      --accent: #58a6ff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(209, 217, 224, 0.7);
        --text-main: #1f2328;
        --text-sub: #656d76;
        --link-bg: rgba(0, 0, 0, 0.03);
        --link-hover-bg: rgba(0, 0, 0, 0.07);
        --link-hover-border: rgba(0, 0, 0, 0.2);
        --accent: #0969da;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar-wrapper {
      margin-bottom: 20px;
      display: inline-block;
      position: relative;
    }

    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      border: 2px solid var(--card-border);
      display: block;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .title {
      font-size: 0.95rem;
      color: var(--text-sub);
      font-weight: 500;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 14px;
      background: var(--link-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .link-item:hover {
      background: var(--link-hover-bg);
      border-color: var(--link-hover-border);
      transform: translateY(-2px);
    }

    .link-item:active {
      transform: translateY(0);
    }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="avatar-wrapper">
      <img src="/assets/author.png" alt="mida avatar" class="avatar">
    </div>
    <h1>mida</h1>
    <p class="title">Data Engineer</p>

    <div class="links">
      <a href="https://github.com/mida-hub" target="_blank" rel="noopener noreferrer" class="link-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>

      <a href="https://twitter.com/mida12251141" target="_blank" rel="noopener noreferrer" class="link-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <span>X (Twitter)</span>
      </a>
    </div>

    <footer>
      <p>&copy; tomatonic.work</p>
    </footer>
  </main>
</body>
</html>
